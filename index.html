<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>StudyMAF</title>

  <!-- Vendored locally — no external requests (self-contained for GitHub Pages). -->
  <link rel="stylesheet" href="vendor/fonts/inter.css" />
  <link rel="stylesheet" href="vendor/katex/katex.min.css" />
  <link rel="stylesheet" href="vendor/mathlive/mathlive-static.css" />
  <link rel="stylesheet" href="vendor/mathlive/mathlive-fonts.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!--
    StudyMAF single-page app. All lesson content lives in /data JSON — never inline here.
    AI-dependent features (tutor, syllabus->lesson generation, homework/test generation)
    are scaffolded UI with clear "next stage" placeholders: this MVP has no backend or keys.
  -->

  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="#/" aria-label="StudyMAF home">Study<span>MAF</span></a>
      <nav class="header-actions">
        <button class="btn ghost" id="open-ai" type="button" title="Ask StudyMAF AI">Ask AI</button>
        <button class="btn ghost" id="open-calc" type="button" title="Calculator">Calculator</button>
        <button class="btn ghost" id="open-fs" type="button" title="Full screen">Full screen</button>
        <button class="btn ghost" id="open-accent" type="button" title="Accent color">
          <span class="accent-dot" aria-hidden="true"></span> Theme
        </button>
      </nav>
    </div>
  </header>

  <main id="app"><!-- views render here --></main>

  <!-- Floating calculator dock (scientific + graphing). Hidden until opened. -->
  <div id="calc-dock" class="calc-dock" hidden aria-hidden="true"></div>

  <!-- Floating AI tutor dock. It is built by js/app.js and never blocks the lesson. -->
  <div id="ai-tutor-dock" class="tutor-dock" hidden aria-hidden="true"></div>

  <!-- Drawing board overlay. Hidden until opened. -->
  <div id="draw-overlay" class="overlay" hidden aria-hidden="true"></div>

  <!-- Generic modal host + toast/XP layer -->
  <div id="modal-host" class="overlay" hidden aria-hidden="true"></div>
  <div id="fx-layer" class="fx-layer" aria-live="polite"></div>
  <button id="open-ai-fab" class="tutor-launcher" type="button" aria-label="Open StudyMAF tutor" title="Open StudyMAF tutor">Tutor</button>

  <footer class="site-footer">
    <div class="wrap">
      <p>StudyMAF — private study tool (MVP). Static site, no accounts, nothing sensitive.</p>
    </div>
  </footer>

  <!-- Vendored KaTeX -->
  <script defer src="vendor/katex/katex.min.js"></script>
  <script defer src="vendor/katex/auto-render.min.js"></script>

  <!-- Vendored MathLive (editable, click-to-position math field) -->
  <script defer src="vendor/mathlive/mathlive.min.js"></script>
  <script>
    // point MathLive at the vendored fonts once its element is registered
    window.addEventListener("DOMContentLoaded", function () {
      if (window.MathfieldElement) {
        window.MathfieldElement.fontsDirectory = "vendor/mathlive/fonts";
        window.MathfieldElement.soundsDirectory = null;
      }
    });
  </script>

  <!-- Soft access gate (NOT real security — see js/gate.js). Loads first. -->
  <script defer src="js/gate.js?v=3"></script>

  <!-- App modules (order matters). The ?v= query busts the browser/CDN cache when a
       module changes — without it, an updated js/*.js can be served stale (e.g. a
       diagram's math rendering as raw $…$ because an old figures.js is cached). Bump
       the number whenever these change. -->
  <script defer src="js/icons.js?v=3"></script>
  <script defer src="js/store.js?v=3"></script>
  <script defer src="js/math.js?v=3"></script>
  <script defer src="js/figures.js?v=3"></script>
  <script defer src="js/calculator.js?v=3"></script>
  <script defer src="js/notebook.js?v=3"></script>
  <script defer src="js/generators.js?v=3"></script>
  <!-- Rho Talk loads its open-source voice only when a learner starts a voice chat. -->
  <script type="module" src="js/rho-voice.js?v=3"></script>
  <script defer src="js/app.js?v=3"></script>
</body>
</html>
